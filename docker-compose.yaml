# Robot Shop
#
# Standard Compose file: works with `docker compose`, `podman compose` and
# `podman-compose`, rootless or root, on any Linux host. Nothing in it is tied
# to a particular machine; per-host settings live in .env:
#   WEB_PORT  - host port for the web UI (default 8085)
#   REPO/TAG  - image names used for the locally built images
#
# Images are fully qualified (docker.io/...) so they pull even on hosts with no
# "unqualified-search registries" configured (default on fresh Podman installs).
# Services find each other by service name on the robot-shop network.

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "25m"
    max-file: "2"

services:
  mongodb:
    build:
      context: mongo
    image: ${REPO:-robotshop}/rs-mongodb:${TAG:-latest}
    restart: unless-stopped
    networks:
      - robot-shop
    logging: *logging

  redis:
    image: docker.io/library/redis:6.2-alpine
    restart: unless-stopped
    networks:
      - robot-shop
    logging: *logging

  rabbitmq:
    image: docker.io/library/rabbitmq:3.8-management-alpine
    restart: unless-stopped
    networks:
      - robot-shop
    logging: *logging

  mysql:
    build:
      context: mysql
    image: ${REPO:-robotshop}/rs-mysql-db:${TAG:-latest}
    restart: unless-stopped
    networks:
      - robot-shop
    logging: *logging

  catalogue:
    build:
      context: catalogue
    image: ${REPO:-robotshop}/rs-catalogue:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - mongodb
    networks:
      - robot-shop
    healthcheck:
      test: [ "CMD", "curl", "-H", "X-INSTANA-SYNTHETIC: 1", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 10s
      retries: 3
    logging: *logging

  user:
    build:
      context: user
    image: ${REPO:-robotshop}/rs-user:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis
    networks:
      - robot-shop
    healthcheck:
      test: [ "CMD", "curl", "-H", "X-INSTANA-SYNTHETIC: 1", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 10s
      retries: 3
    logging: *logging

  cart:
    build:
      context: cart
    image: ${REPO:-robotshop}/rs-cart:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - robot-shop
    healthcheck:
      test: [ "CMD", "curl", "-H", "X-INSTANA-SYNTHETIC: 1", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 10s
      retries: 3
    logging: *logging

  shipping:
    build:
      context: shipping
    image: ${REPO:-robotshop}/rs-shipping:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - mysql
    networks:
      - robot-shop
    healthcheck:
      test: [ "CMD", "curl", "-H", "X-INSTANA-SYNTHETIC: 1", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 10s
      retries: 3
    logging: *logging

  ratings:
    build:
      context: ratings
    image: ${REPO:-robotshop}/rs-ratings:${TAG:-latest}
    restart: unless-stopped
    environment:
      APP_ENV: prod
    depends_on:
      - mysql
    networks:
      - robot-shop
    healthcheck:
      test: [ "CMD", "curl", "-H", "X-INSTANA-SYNTHETIC: 1", "-f", "http://localhost/_health" ]
      interval: 10s
      timeout: 10s
      retries: 3
    logging: *logging

  payment:
    build:
      context: payment
    image: ${REPO:-robotshop}/rs-payment:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - rabbitmq
    networks:
      - robot-shop
    healthcheck:
      test: [ "CMD", "curl", "-H", "X-INSTANA-SYNTHETIC: 1", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 10s
      retries: 3
    # Uncomment to change payment gateway
    #environment:
      #PAYMENT_GATEWAY: "https://www.worldpay.com"
    logging: *logging

  dispatch:
    build:
      context: dispatch
    image: ${REPO:-robotshop}/rs-dispatch:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - rabbitmq
    networks:
      - robot-shop
    logging: *logging

  web:
    build:
      context: web
      args:
        # agent key to download tracing libs (optional)
        KEY: ${INSTANA_AGENT_KEY:-}
    image: ${REPO:-robotshop}/rs-web:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - catalogue
      - user
      - cart
      - shipping
      - ratings
      - payment
    ports:
      - "${WEB_PORT:-8085}:8080"
    networks:
      - robot-shop
    healthcheck:
      test: [ "CMD", "curl", "-H", "X-INSTANA-SYNTHETIC: 1", "-f", "http://localhost:8080/" ]
      interval: 10s
      timeout: 10s
      retries: 3
    # Uncomment to enable Instana EUM
    # environment:
      # INSTANA_EUM_KEY: <your eum key>
      # INSTANA_EUM_REPORTING_URL: <your reporting url>
    logging: *logging

networks:
  robot-shop:
